<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOTSTRAP Rács</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        #piros {
            background-color: red;
            height: 50vh;
        }

        #zöld {
            background-color: green;
            height: 50vh;
        }

        #kék {
            background-color: blue;
            height: 50vh;
        }

        #sárga {
            background-color: yellow;
            height: 50vh;
        }

        #fekete {
            background-color: black;
            color: white;
            height: 50vh;
        }

        #fehér {
            background-color: white;
            outline: 1px solid black;
            height: 50vh;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-lg-4 col-md-6 col-12" id="piros">Első konténer</div>
            <div class="col-lg-4 col-md-6 col-12" id="zöld">Második konténer</div>
            <div class="col-lg-4 col-md-6 col-12" id="kék">Harmadik konténer</div>
            <div class="col-lg-4 col-md-6 col-12" id="sárga">Negyedik konténer</div>
            <div class="col-lg-4 col-md-6 col-12" id="fekete">Ötödik konténer</div>
            <div class="col-lg-4 col-md-6 col-12" id="fehér">Hatodik konténer</div>
        </div>
    </div>
</body>

</html>
